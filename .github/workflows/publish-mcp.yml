name: Publish to MCP Registry

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # OIDC 认证必需（无需任何 secret）
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Show what is being published
        run: cat server.json

      # 2026-11-08：**不再下载 mcp-publisher 二进制**。
      #   `mcp-publisher_linux_amd64.tar.gz` 在 objects.githubusercontent.com 上
      #   连续 7 次 504（runs 42469128974 / 42469250965 / 42469309767），
      #   releases/latest/download 直连还回过 92 字节的错误页（tar 报 not in gzip format）。
      #   Registry 本身就是 HTTP API，CLI 只是它的壳 ⇒ 直接调 API，少一个外部二进制依赖。
      - name: Publish to MCP Registry (official HTTP API)
        run: python3 .github/scripts/publish_registry.py
